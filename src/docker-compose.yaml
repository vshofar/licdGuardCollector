version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: licitguard-neo4j
    ports:
      - "7474:7474" # Browser HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/licitguard123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allow__list=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs: